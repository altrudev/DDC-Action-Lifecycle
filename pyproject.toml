[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ddc-action-lifecycle"
version = "0.1.0"
description = "Append-only evidence lifecycle for consequential agent actions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary runtime; see LICENSE-POLICY.md"}
authors = [{name = "Valentyn Rukhaylo"}]
dependencies = []

[project.scripts]
ddc-lifecycle = "ddc_action_lifecycle.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
